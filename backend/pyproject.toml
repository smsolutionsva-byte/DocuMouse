[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "documouse"
version = "0.1.0"
description = "Drop your documents in. DocuMouse figures them out."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
# The document engine. Kept optional so the API, tests and frontend can be
# developed on machines where PaddlePaddle wheels are not available.
ocr = [
  # PaddlePaddle 3.3.x fails CPU inference with oneDNN enabled
  # ("ConvertPirAttribute2RuntimeAttribute not support"), and with oneDNN off it is ~4x slower.
  # 3.2.2 is the newest release that works; revisit when upstream fixes it.
  "paddlepaddle==3.2.2",
  "paddleocr[doc-parser]>=3.7,<4",
]
dev = [
  "pytest>=8",
  "reportlab>=4",
]
# Benchmarks in eval/ (SROIE images ship as Parquet on Hugging Face).
eval = [
  "pyarrow>=15",
  "huggingface_hub>=0.23",
]

[tool.setuptools.packages.find]
include = ["documouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
